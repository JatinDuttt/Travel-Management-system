spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/travel?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always
# DEV DEFAULTS ONLY - override all of these via environment variables in any real deployment
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes!!}
app.jwt.expiration-ms=86400000
app.admin.email=${ADMIN_EMAIL:admin@travel.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
management.endpoints.web.exposure.include=health,info,prometheus


server.port=8081