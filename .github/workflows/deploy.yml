@'
name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER }}/travel-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/travel-web:latest

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Write server env file
        run: |
          cat > server.env <<EOT
          OWNER=${OWNER}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          EOT

      - name: Copy files to server
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml ubuntu@${{ secrets.EC2_HOST }}:/opt/travel/docker-compose.yml
          scp -i ~/.ssh/deploy_key deploy/Caddyfile ubuntu@${{ secrets.EC2_HOST }}:/opt/travel/Caddyfile
          scp -i ~/.ssh/deploy_key server.env ubuntu@${{ secrets.EC2_HOST }}:/opt/travel/.env

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} "chmod 600 /opt/travel/.env && echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && cd /opt/travel && docker compose pull && docker compose up -d && docker image prune -f"
'@ | Set-Content -Path .github\workflows\deploy.yml -Encoding utf8